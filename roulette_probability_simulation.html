<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roulette probability simulation</title><style>:root{--paper:#f8f5ed;--navy:#142744;--gold:#c39436;--ink:#485361}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 34px}.kicker{color:var(--gold);font-size:12px;letter-spacing:.18em;font-weight:700;text-transform:uppercase}.grid{display:grid;grid-template-columns:390px 1fr;gap:34px}.panel{background:#ffffff42;border:1px solid #dfd5c4;border-radius:18px;padding:20px}.wheelBox{display:grid;place-items:center;min-height:390px;position:relative}.wheelStage{width:340px;height:340px;position:relative}.wheelImage{width:100%;height:100%;display:block;transition:transform 1.15s cubic-bezier(.12,.72,.14,1);filter:drop-shadow(0 8px 12px #14274425)}.pointer{position:absolute;z-index:4;left:50%;top:-10px;width:0;height:0;margin-left:-13px;border-left:13px solid transparent;border-right:13px solid transparent;border-top:25px solid var(--gold);filter:drop-shadow(0 2px 2px #14274455)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:999px;padding:12px 16px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn:hover{background:#263d63}.btn:disabled{opacity:.5;cursor:wait}.reset{background:transparent;color:var(--navy);border:1px solid var(--navy)}.mode{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--ink)}select{border:1px solid #b9ad99;border-radius:8px;padding:8px;background:#fff;color:var(--navy);font-weight:700}.stats{display:flex;justify-content:space-between;margin-top:16px;font-size:14px;color:var(--ink)}canvas{width:100%;height:430px;background:#ffffff4d;border:1px solid #dfd5c4;border-radius:18px}.caption{font-size:12px;color:var(--ink);margin-top:10px;line-height:1.45}@media(max-width:850px){.grid{grid-template-columns:1fr}.wheelBox{min-height:340px}}</style></head><body><main class="wrap"><div class="kicker">Probability distributions</div><div class="grid"><section class="panel"><div class="wheelBox"><div class="wheelStage"><div class="pointer" aria-hidden="true"></div><img id="wheel" class="wheelImage" src="roulette_wheel_transparent.png" alt="European roulette wheel"></div></div><div class="mode"><label for="mode">Wheel:</label><select id="mode"><option value="uniform">Wheel A</option><option value="uneven">Wheel B</option></select></div><div class="controls"><button class="btn" data-n="1">Spin once</button><button class="btn" data-n="10">Spin 10 times</button><button class="btn" data-n="1000">Spin 1,000 times</button><button class="btn reset" id="reset">Reset</button></div><div class="stats"><span>Total spins: <b id="total">0</b></span><span>Last outcome: <b id="last">Ã¢â‚¬â€</b></span></div></section><section><canvas id="hist" width="720" height="430"></canvas><div class="caption">Each bar shows the observed frequency of an outcome.</div></section></div></main><script>const order=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26],red=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]),favoured=new Set([7,8,9,17,18,19,22,28,29]),wheel=document.querySelector('#wheel'),hist=document.querySelector('#hist'),ctx=hist.getContext('2d');let counts=Array(37).fill(0),total=0,rotation=0,busy=false;function choose(){const uneven=document.querySelector('#mode').value==='uneven';let r=Math.random()*(37+(uneven?favoured.size*.5:0));for(const n of order){r-=uneven&&favoured.has(n)?1.5:1;if(r<0)return n}return 0}function draw(){let w=hist.width,h=hist.height,p={l:52,r:20,t:32,b:52},pw=w-p.l-p.r,ph=h-p.t-p.b,max=Math.max(1,...counts);ctx.clearRect(0,0,w,h);ctx.fillStyle='#f8f5ed';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#aeb3b2';ctx.beginPath();ctx.moveTo(p.l,p.t);ctx.lineTo(p.l,h-p.b);ctx.lineTo(w-p.r,h-p.b);ctx.stroke();for(let i=0;i<=4;i++){let value=max*i/4,y=h-p.b-ph*i/4;ctx.strokeStyle='#ddd6c9';ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(w-p.r,y);ctx.stroke();if(Number.isInteger(value)){ctx.fillStyle='#485361';ctx.font='12px Arial';ctx.fillText(value,8,y+4)}}let bw=pw/37;for(let n=0;n<37;n++){let bh=counts[n]/max*ph,x=p.l+n*bw+1,y=h-p.b-bh;ctx.fillStyle=n===0?'#c39436':red.has(n)?'#9e2638':'#1b1f23';ctx.fillRect(x,y,Math.max(2,bw-2),bh);if(n%2===0){ctx.fillStyle='#485361';ctx.font='10px Arial';ctx.fillText(n,x+1,h-p.b+17)}}ctx.fillStyle='#142744';ctx.font='700 16px Georgia';ctx.fillText('Observed outcome frequencies',p.l,p.t-10)}function spinOnce(){const n=choose();counts[n]++;total++;document.querySelector('#last').textContent=n;return n}function finish(){document.querySelector('#total').textContent=total;document.querySelectorAll('.btn').forEach(b=>b.disabled=false);document.querySelector('#mode').disabled=false;busy=false}function run(n){if(busy)return;busy=true;document.querySelectorAll('.btn').forEach(b=>b.disabled=true);document.querySelector('#mode').disabled=true;if(n<1000){let i=0;function tick(){if(i<n){const outcome=spinOnce(),index=order.indexOf(outcome),sector=360/order.length,target=-index*sector,current=((rotation%360)+360)%360,delta=((target-current+540)%360)-180;rotation+=1440+delta;wheel.style.transform=`rotate(${rotation}deg)`;draw();i++;setTimeout(tick,260)}else finish()}tick()}else{for(let i=0;i<n;i++)spinOnce();draw();finish()}}document.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>run(+b.dataset.n)));document.querySelector('#reset').addEventListener('click',()=>{counts=Array(37).fill(0);total=0;rotation=0;wheel.style.transform='rotate(0deg)';document.querySelector('#total').textContent='0';document.querySelector('#last').textContent='Ã¢â‚¬â€';draw()});draw();</script></body></html>
